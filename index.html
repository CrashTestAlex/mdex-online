<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>MonsterDex Online - v1.1.91</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
      }
      #unity-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #000000;
      }
      #splash {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        opacity: 0;
        transition: opacity 1s ease; /* fade duration, keep in sync with FADE_MS below */
      }
      #splash img {
        max-width: 80%;
        max-height: 80%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div id="splash"><img src="splash.png" alt="MonsterDex Online"></div>

    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <script src="Build/Downloads.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      // Game loads in the background while the splash plays.
      const gameReady = createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/Downloads.data.unityweb",
        frameworkUrl: "Build/Downloads.framework.js.unityweb",
        codeUrl: "Build/Downloads.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "newzac",
        productName: "MonsterDex Online",
        productVersion: "1.1.91",
      }).catch((message) => {
        alert(message);
      });

      const FADE_MS = 1000;
      const HOLD_MS = 4000;
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      (async function runSplash() {
        const splash = document.getElementById("splash");
        const img = splash.querySelector("img");

        // Wait for image load
        await new Promise((resolve) => {
          if (img.complete) resolve();
          else { img.onload = resolve; img.onerror = resolve; }
        });

        img.style.width  = (img.naturalWidth  * 2.25) + "px";
        img.style.height = (img.naturalHeight * 2.25) + "px";

        splash.style.opacity = "1";
        await wait(FADE_MS + HOLD_MS);

        await gameReady;

        splash.style.opacity = "0";
        await wait(FADE_MS);
        splash.remove();
      })();
    </script>
  </body>
</html>
